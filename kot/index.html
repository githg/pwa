<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cash Register KOT</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b101b;
      --card: #131b2c;
      --inner: #0e1524;
      --border: rgba(255,255,255,0.1);
      --text: #f8fafc;
      --muted: #94a3b8;
      --pos: #10b981;
      --neg: #ef4444;
      --warn: #f59e0b;
      --info: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); min-height: 100dvh; display: flex; flex-direction: column; }
    .topbar {
      display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 10px 14px; background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20;
    }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      padding: 7px 12px; border-radius: 9px; border: 1px solid var(--border); background: var(--inner);
      color: var(--muted); font-size: 12px; font-weight: 800; cursor: pointer;
    }
    .chip.active { background: #10b981; color: #fff; border-color: transparent; }
    .btn {
      padding: 7px 12px; border-radius: 9px; border: 1px solid var(--border); background: var(--inner);
      color: var(--text); font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .btn-primary { background: #10b981; color: #fff; border-color: transparent; }
    .main { padding: 12px; width: 100%; max-width: 1280px; margin: 0 auto; flex: 1; }
    .grid { display: grid; grid-template-columns: 1.25fr 1fr; gap: 12px; align-items: start; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; }
    .manual-dock { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 6px; }
    @media (max-width: 520px) { .manual-dock { grid-template-columns: repeat(3, 1fr); } }
    .ctr-tile {
      padding: 11px 4px; border-radius: 10px; border: 1px solid var(--border); background: var(--inner);
      color: var(--text); font-size: 13px; font-weight: 800; cursor: pointer; text-align: center;
    }
    .ctr-tile.refund { background: rgba(239,68,68,0.14); border-color: rgba(239,68,68,0.4); color: var(--neg); }
    .kot-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; max-height: 70dvh; overflow-y: auto; }
    .kot-card {
      display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px;
      border-radius: 12px; background: var(--card); border: 1.5px solid var(--border); border-left-width: 5px; cursor: pointer;
    }
    .kot-card.selected { border-color: var(--pos); background: rgba(16,185,129,0.12); }
    .kot-card.c1 { border-left-color: #f8fafc; }
    .kot-card.c2 { border-left-color: #eab308; }
    .kot-card.c3 { border-left-color: #4ade80; }
    .kot-card.c4 { border-left-color: #06b6d4; }
    .kot-card.c5 { border-left-color: #14b8a6; }
    .kot-card.c0 { border-left-color: #a855f7; }
    .pos-panel { position: sticky; top: 64px; display: flex; flex-direction: column; gap: 10px; }
    .kv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .kv { background: var(--inner); border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
    .kv-lbl { font-size: 10px; font-weight: 800; color: var(--muted); text-transform: uppercase; }
    .kv-val { font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; margin-top: 2px; }
    .chg-bar {
      padding: 10px 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center;
      background: rgba(16,185,129,0.14); border: 1px solid rgba(16,185,129,0.35); color: var(--pos);
    }
    .chg-bar.short { background: rgba(239,68,68,0.14); border-color: rgba(239,68,68,0.4); color: var(--neg); }
    .quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .qchip {
      padding: 10px 4px; border-radius: 9px; border: 1px solid var(--border); background: var(--inner);
      color: var(--text); font-size: 12px; font-weight: 800; cursor: pointer;
    }
    .qchip.exact { background: rgba(16,185,129,0.16); border-color: rgba(16,185,129,0.45); color: var(--pos); }
    .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
    .num-btn {
      height: 52px; border-radius: 11px; border: 1px solid var(--border); background: var(--inner);
      color: var(--text); font-size: 20px; font-weight: 700; cursor: pointer;
    }
    .num-btn:active { background: rgba(255,255,255,0.15); transform: scale(0.97); }
    .charge-btn {
      width: 100%; padding: 15px; border-radius: 12px; border: none; font-size: 15px; font-weight: 900;
      background: linear-gradient(135deg, #10b981, #059669); color: #fff; cursor: pointer;
    }
    .charge-btn.refund { background: linear-gradient(135deg, #ef4444, #dc2626); }
    .charge-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .inp {
      width: 100%; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--border);
      background: var(--inner); color: var(--text); font-size: 13px; font-weight: 600;
    }
    .badge { padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; background: var(--inner); border: 1px solid var(--border); }
    #toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #111827; color: #fff;
      padding: 10px 18px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.2); font-size: 12.5px;
      font-weight: 700; display: none; z-index: 99;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="tabs">
      <button class="chip active" id="tab-pending" onclick="setTab('pending')">Pending KOT (<span id="cnt-pending">0</span>)</button>
      <button class="chip" id="tab-collected" onclick="setTab('collected')">Collected (<span id="cnt-collected">0</span> · Rs <span id="sum-collected">0</span>)</button>
      <button class="chip" id="tab-setup" onclick="setTab('setup')">⚙ Printer &amp; Realtime</button>
    </div>
    <div style="display:flex; gap:8px; align-items:center;">
      <span class="badge" id="live-status">Offline / Local</span>
      <button class="btn" onclick="openDrawerManual()">Open Drawer</button>
    </div>
  </div>

  <div class="main">
    <div class="card" id="setup-panel" style="display:none; flex-direction:column; gap:10px; max-width:680px; margin:0 auto;">
      <div style="font-size:14px; font-weight:800;">Xprinter Wi-Fi &amp; Firebase Realtime KOT Setup</div>
      <div style="display:grid; grid-template-columns:2fr 1fr 1fr; gap:8px;">
        <div><div class="kv-lbl" style="margin-bottom:4px;">Xprinter Wi-Fi IP</div><input id="cfg-ip" class="inp" placeholder="192.168.1.100" /></div>
        <div><div class="kv-lbl" style="margin-bottom:4px;">TCP Port</div><input id="cfg-port" type="number" class="inp" value="9100" /></div>
        <div>
          <div class="kv-lbl" style="margin-bottom:4px;">On Charge</div>
          <select id="cfg-mode" class="inp">
            <option value="kick_only">Drawer Kick Only (0 paper)</option>
            <option value="kick_token">Kick + Mini Cash Token</option>
          </select>
        </div>
      </div>
      <div>
        <div class="kv-lbl" style="margin-bottom:4px;">Firebase Realtime DB URL</div>
        <input id="cfg-fb" class="inp" placeholder="https://your-project-default-rtdb.asia-southeast1.firebasedatabase.app" />
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-primary" onclick="saveConfig()">Save Settings</button>
        <button class="btn" onclick="testPrinter()">Test Xprinter &amp; Kick Drawer</button>
      </div>
    </div>

    <div class="grid" id="pos-grid">
      <div>
        <div class="card">
          <div class="kv-lbl">Quick Manual Cash-In / Orphan Refund (Loyverse Mode)</div>
          <div class="manual-dock">
            <button class="ctr-tile" onclick="startManual('1', false)">C1</button>
            <button class="ctr-tile" onclick="startManual('2', false)">C2</button>
            <button class="ctr-tile" onclick="startManual('3', false)">C3</button>
            <button class="ctr-tile" onclick="startManual('4', false)">C4</button>
            <button class="ctr-tile" onclick="startManual('5', false)">C5</button>
            <button class="ctr-tile refund" onclick="startManual('1', true)">− Refund</button>
          </div>
        </div>
        <div class="kot-list" id="kot-list"></div>
      </div>

      <div class="card pos-panel">
        <div>
          <div id="sel-title" style="font-size:15px; font-weight:800;">Ready for Next KOT</div>
          <div id="sel-sub" style="font-size:11.5px; color:var(--muted);">Tap a pending cash bill or C1–C5</div>
        </div>
        <div id="manual-row" style="display:none; gap:6px;">
          <select id="manual-ctr" class="inp" style="width:120px;">
            <option value="1">Counter 1</option><option value="2">Counter 2</option>
            <option value="3">Counter 3</option><option value="4">Counter 4</option>
            <option value="5">Counter 5</option><option value="0">Counter 0</option>
          </select>
          <input id="manual-note" class="inp" placeholder="Note (optional)" />
        </div>
        <div class="kv-grid">
          <div class="kv"><div class="kv-lbl" id="due-lbl">BILL DUE</div><div class="kv-val" id="due-val">Rs 0</div></div>
          <div class="kv" style="border-color:rgba(16,185,129,0.4);"><div class="kv-lbl" style="color:var(--pos);" id="recv-lbl">CASH RECEIVED</div><div class="kv-val" style="color:var(--pos);" id="recv-val">Rs 0</div></div>
        </div>
        <div class="chg-bar" id="chg-bar">
          <span style="font-size:11px; font-weight:800;" id="chg-lbl">CHANGE TO RETURN</span>
          <span style="font-size:22px; font-weight:900; font-variant-numeric:tabular-nums;" id="chg-val">Rs 0</span>
        </div>
        <div class="quick-grid" id="quick-chips"></div>
        <div class="numpad">
          <button class="num-btn" onclick="pad('7')">7</button><button class="num-btn" onclick="pad('8')">8</button><button class="num-btn" onclick="pad('9')">9</button>
          <button class="num-btn" onclick="pad('4')">4</button><button class="num-btn" onclick="pad('5')">5</button><button class="num-btn" onclick="pad('6')">6</button>
          <button class="num-btn" onclick="pad('1')">1</button><button class="num-btn" onclick="pad('2')">2</button><button class="num-btn" onclick="pad('3')">3</button>
          <button class="num-btn" onclick="pad('C')" style="color:var(--neg); font-size:15px;">CLR</button><button class="num-btn" onclick="pad('0')">0</button><button class="num-btn" onclick="pad('00')" style="font-size:16px;">00</button>
        </div>
        <button class="charge-btn" id="btn-charge" onclick="chargeNow()" disabled>CHARGE · OPEN DRAWER</button>
      </div>
    </div>
  </div>
  <div id="toast"></div>

  <script>
    let kots = [];
    let activeTab = 'pending';
    let selectedId = null;
    let manualMode = null;
    let tenderStr = '';
    let sse = null;

    function todayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
    function nowTs() {
      const d = new Date();
      return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getFullYear()).slice(-2)}`;
    }
    function toast(msg) {
      const el = document.getElementById('toast');
      if (!el) return;
      el.innerText = msg; el.style.display = 'block';
      clearTimeout(toast._t);
      toast._t = setTimeout(() => { el.style.display = 'none'; }, 2400);
    }
    function getConfig() {
      return {
        ip: (localStorage.getItem('xprinterIp') || '').trim(),
        port: parseInt(localStorage.getItem('xprinterPort') || '9100', 10) || 9100,
        mode: localStorage.getItem('xprinterMode') || 'kick_only',
        fb: (localStorage.getItem('kotFirebaseUrl') || '').trim().replace(/\/+$/, '')
      };
    }
    function saveLocalKots() {
      try { localStorage.setItem('kot_cache_' + todayKey(), JSON.stringify(kots)); } catch (e) {}
    }
    function loadLocalKots() {
      try { kots = JSON.parse(localStorage.getItem('kot_cache_' + todayKey()) || '[]'); } catch (e) { kots = []; }
    }
    function saveConfig() {
      localStorage.setItem('xprinterIp', (document.getElementById('cfg-ip').value || '').trim());
      localStorage.setItem('xprinterPort', document.getElementById('cfg-port').value || '9100');
      localStorage.setItem('xprinterMode', document.getElementById('cfg-mode').value || 'kick_only');
      localStorage.setItem('kotFirebaseUrl', (document.getElementById('cfg-fb').value || '').trim().replace(/\/+$/, ''));
      toast('Settings saved!');
      connectRealtime(true);
      setTab('pending');
    }
    function playChime() {
      if (window.AndroidCashBridge && window.AndroidCashBridge.playChime) { window.AndroidCashBridge.playChime(); return; }
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        const ac = new AC(), o = ac.createOscillator(), g = ac.createGain();
        o.frequency.setValueAtTime(880, ac.currentTime); o.frequency.exponentialRampToValueAtTime(1320, ac.currentTime + 0.12);
        g.gain.setValueAtTime(0.18, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.24);
        o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.25);
      } catch (e) {}
    }
    function openDrawerManual() {
      const c = getConfig();
      if (window.AndroidCashBridge && window.AndroidCashBridge.openDrawer) {
        if (!c.ip) { toast('Set Xprinter IP in ⚙ Printer & Realtime'); return; }
        const r = window.AndroidCashBridge.openDrawer(c.ip, c.port);
        toast(r === 'OK' ? 'Cash drawer opened!' : 'Drawer error: ' + r);
      } else {
        toast('Open in Android Cash Register APK to kick Wi-Fi Xprinter');
      }
    }
    function testPrinter() { saveConfig(); openDrawerManual(); }

    function buildQuickOptions(due) {
      const amt = Math.max(0, Math.round(due));
      if (!amt) return [];
      const s = new Set([amt]);
      [100, 500, 1000, 5000].forEach(step => { const r = Math.ceil(amt / step) * step; if (r > amt) s.add(r); });
      if (s.size < 4) s.add(amt + 500);
      if (s.size < 4) s.add(amt + 1000);
      return Array.from(s).sort((a, b) => a - b).slice(0, 4);
    }

    function connectRealtime(restart = false) {
      const c = getConfig();
      const st = document.getElementById('live-status');
      if (!c.fb || typeof EventSource === 'undefined') { if (st) st.innerText = 'Offline / Local'; return; }
      if (sse && !restart) return;
      if (sse) { try { sse.close(); } catch (e) {} sse = null; }
      sse = new EventSource(`${c.fb}/kot/${todayKey()}.json`);
      if (st) { st.innerText = '● LIVE KOT'; st.style.color = '#10b981'; }
      const ingest = (raw) => {
        if (!raw) return;
        const list = (raw.id && raw.counterId !== undefined) ? [raw] : Object.values(raw);
        let added = false;
        list.forEach(item => {
          if (!item || !item.id) return;
          const id = String(item.id);
          const idx = kots.findIndex(x => String(x.id) === id);
          if (idx === -1) { kots.push({ ...item, id }); if (item.status !== 'collected') added = true; }
          else if (item.status === 'collected' && kots[idx].status !== 'collected') { kots[idx] = { ...kots[idx], ...item, id }; }
        });
        saveLocalKots();
        if (added) playChime();
        render();
      };
      sse.addEventListener('put', e => { try { ingest(JSON.parse(e.data).data); } catch (_) {} });
      sse.addEventListener('patch', e => { try { ingest(JSON.parse(e.data).data); } catch (_) {} });
      sse.onerror = () => { if (st) { st.innerText = 'Reconnecting…'; st.style.color = '#f59e0b'; } };
    }

    function setTab(t) {
      activeTab = t;
      ['pending', 'collected', 'setup'].forEach(x => document.getElementById('tab-' + x)?.classList.toggle('active', x === t));
      document.getElementById('setup-panel').style.display = t === 'setup' ? 'flex' : 'none';
      document.getElementById('pos-grid').style.display = t === 'setup' ? 'none' : 'grid';
      if (t === 'setup') {
        const c = getConfig();
        document.getElementById('cfg-ip').value = c.ip;
        document.getElementById('cfg-port').value = c.port;
        document.getElementById('cfg-mode').value = c.mode;
        document.getElementById('cfg-fb').value = c.fb;
      } else render();
    }

    function selectKot(id) { manualMode = null; selectedId = String(id); tenderStr = ''; render(); }
    function startManual(cid, isRefund) {
      selectedId = null; manualMode = { counterId: String(cid), isRefund: !!isRefund }; tenderStr = '';
      document.getElementById('manual-ctr').value = String(cid);
      document.getElementById('manual-note').value = '';
      render();
    }
    function pad(k) {
      if (k === 'C') tenderStr = '';
      else if (k === '00') tenderStr = tenderStr ? (tenderStr + '00') : '';
      else tenderStr = (tenderStr === '0' ? k : tenderStr + k).slice(0, 9);
      renderTender();
    }
    function quickSet(v) { tenderStr = String(v); renderTender(); }
    function toggleCheck(id) {
      const k = kots.find(x => String(x.id) === String(id));
      if (!k) return;
      k.manualCheck = !k.manualCheck;
      saveLocalKots();
      render();
    }

    function render() {
      const pending = kots.filter(k => Number(k.cash || 0) > 0 && k.status !== 'collected').slice().reverse();
      const collected = kots.filter(k => Number(k.cash || 0) < 0 || k.status === 'collected').slice().reverse();
      document.getElementById('cnt-pending').innerText = pending.length;
      document.getElementById('cnt-collected').innerText = collected.length;
      document.getElementById('sum-collected').innerText = collected.reduce((s, k) => s + Number(k.cash || 0), 0).toLocaleString();

      if (!manualMode && activeTab === 'pending' && !pending.find(k => String(k.id) === String(selectedId))) {
        selectedId = pending.length ? String(pending[0].id) : null;
        tenderStr = '';
      }

      const listEl = document.getElementById('kot-list');
      const items = activeTab === 'collected' ? collected : pending;
      if (!items.length) {
        listEl.innerHTML = `<div class="card" style="text-align:center; padding:32px; color:var(--muted);">${activeTab === 'collected' ? 'No cash collected yet today.' : '✅ All caught up! No pending KOTs.'}</div>`;
      } else {
        listEl.innerHTML = items.map(k => {
          const cash = Number(k.cash || 0), isRef = cash < 0;
          const sel = !manualMode && String(k.id) === String(selectedId);
          const chk = activeTab === 'collected' ? `<input type="checkbox" ${k.manualCheck ? 'checked' : ''} onclick="event.stopPropagation(); toggleCheck('${k.id}')" style="width:18px; height:18px; accent-color:#10b981;" />` : '';
          return `<div class="kot-card c${k.counterId || '1'} ${sel ? 'selected' : ''}" onclick="selectKot('${k.id}')">
            <div style="display:flex; align-items:center; gap:10px;">
              ${chk}
              <div>
                <div style="font-size:13px; font-weight:800;"><span class="badge">C${k.counterId || '1'}</span> ${(k.timestamp || '').split(' ')[0] || ''}</div>
                <div style="font-size:11px; color:var(--muted); margin-top:3px;">${isRef ? (k.remarks || 'Refund') : (k.status === 'collected' ? `Recv Rs ${(k.tendered || cash).toLocaleString()} · Chg Rs ${(k.change || 0).toLocaleString()}` : (k.remarks || 'Cash Bill'))}</div>
              </div>
            </div>
            <div style="text-align:right; font-size:18px; font-weight:900; color:${isRef ? 'var(--neg)' : 'var(--pos)'};">${isRef ? '−' : ''}Rs ${Math.abs(cash).toLocaleString()}</div>
          </div>`;
        }).join('');
      }
      renderTender();
    }

    function renderTender() {
      const typed = parseFloat(tenderStr) || 0;
      const btn = document.getElementById('btn-charge');
      const chgBar = document.getElementById('chg-bar');
      if (manualMode) {
        const isRef = manualMode.isRefund;
        document.getElementById('sel-title').innerText = isRef ? 'Cash Out / Orphan Refund' : `Manual Cash-In (C${manualMode.counterId})`;
        document.getElementById('sel-sub').innerText = 'Loyverse fallback mode';
        document.getElementById('manual-row').style.display = 'flex';
        document.getElementById('due-lbl').innerText = isRef ? 'REFUND OUT' : 'MANUAL CASH';
        document.getElementById('due-val').innerText = 'Rs ' + typed.toLocaleString();
        document.getElementById('recv-val').innerText = 'Rs ' + typed.toLocaleString();
        chgBar.style.display = 'none';
        document.getElementById('quick-chips').innerHTML = [500, 1000, 2000, 5000].map(v => `<button class="qchip" onclick="quickSet(${v})">${v.toLocaleString()}</button>`).join('');
        btn.disabled = typed <= 0;
        btn.classList.toggle('refund', isRef);
        btn.innerText = isRef ? `PAY REFUND Rs ${typed.toLocaleString()} · OPEN DRAWER` : `RECORD Rs ${typed.toLocaleString()} · OPEN DRAWER`;
        return;
      }
      document.getElementById('manual-row').style.display = 'none';
      chgBar.style.display = 'flex';
      btn.classList.remove('refund');
      const k = selectedId ? kots.find(x => String(x.id) === String(selectedId)) : null;
      if (!k) {
        document.getElementById('sel-title').innerText = 'Ready for Next KOT';
        document.getElementById('sel-sub').innerText = 'Tap a pending cash bill or C1–C5';
        document.getElementById('due-val').innerText = 'Rs 0';
        document.getElementById('recv-val').innerText = 'Rs 0';
        document.getElementById('chg-val').innerText = 'Rs 0';
        document.getElementById('quick-chips').innerHTML = '';
        btn.disabled = true; btn.innerText = 'CHARGE · OPEN DRAWER';
        return;
      }
      const due = Math.max(0, Number(k.cash || 0));
      const recv = tenderStr === '' ? due : typed;
      const chg = recv - due;
      document.getElementById('sel-title').innerText = `Counter ${k.counterId} · Bill`;
      document.getElementById('sel-sub').innerText = k.timestamp || '';
      document.getElementById('due-lbl').innerText = 'BILL DUE';
      document.getElementById('due-val').innerText = 'Rs ' + due.toLocaleString();
      document.getElementById('recv-val').innerText = 'Rs ' + recv.toLocaleString();
      chgBar.classList.toggle('short', chg < 0);
      document.getElementById('chg-lbl').innerText = chg < 0 ? 'SHORT BY' : 'CHANGE TO RETURN';
      document.getElementById('chg-val').innerText = 'Rs ' + Math.abs(chg).toLocaleString();
      document.getElementById('quick-chips').innerHTML = buildQuickOptions(due).map((v, i) => `<button class="qchip ${i === 0 ? 'exact' : ''}" onclick="quickSet(${v})">${i === 0 ? 'Exact' : v.toLocaleString()}</button>`).join('');
      btn.disabled = (k.status === 'collected' || chg < 0);
      btn.innerText = k.status === 'collected' ? 'ALREADY COLLECTED ✓' : `CHARGE Rs ${due.toLocaleString()} · OPEN DRAWER`;
    }

    function kickOrPrint(ref, ctr, amt, recv, chg, ts) {
      const c = getConfig();
      if (!window.AndroidCashBridge || !c.ip) return;
      if (c.mode === 'kick_token' && window.AndroidCashBridge.printCashToken) {
        window.AndroidCashBridge.printCashToken(c.ip, c.port, ref, ctr, String(amt), String(recv), String(chg), ts);
      } else if (window.AndroidCashBridge.openDrawer) {
        window.AndroidCashBridge.openDrawer(c.ip, c.port);
      }
    }

    function chargeNow() {
      const ts = nowTs(), c = getConfig();
      if (manualMode) {
        const amt = parseFloat(tenderStr) || 0;
        if (amt <= 0) return;
        const cid = document.getElementById('manual-ctr').value || manualMode.counterId;
        const note = (document.getElementById('manual-note').value || '').trim();
        const isRef = manualMode.isRefund;
        const item = { id: String(Date.now()), counterId: cid, date: todayKey(), timestamp: ts, cash: isRef ? -amt : amt, tendered: amt, change: 0, status: 'collected', manualCheck: true, remarks: isRef ? ('REFUND' + (note ? ': ' + note : '')) : (note || 'Manual Cash') };
        kickOrPrint(`C${cid}-${isRef ? 'REF' : 'MAN'}`, `Counter ${cid}`, item.cash, amt, 0, ts);
        kots.push(item); saveLocalKots();
        if (c.fb) fetch(`${c.fb}/kot/${todayKey()}/${item.id}.json`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(item) }).catch(() => {});
        manualMode = null; tenderStr = '';
        toast(isRef ? `Refund Rs ${amt.toLocaleString()} paid!` : `Manual Cash Rs ${amt.toLocaleString()} saved!`);
        render(); return;
      }
      const k = selectedId ? kots.find(x => String(x.id) === String(selectedId)) : null;
      if (!k) return;
      const due = Number(k.cash || 0), recv = tenderStr === '' ? due : (parseFloat(tenderStr) || 0), chg = recv - due;
      if (chg < 0) return;
      kickOrPrint(`C${k.counterId}-${k.id.slice(-4)}`, `Counter ${k.counterId}`, due, recv, chg, ts);
      k.status = 'collected'; k.tendered = recv; k.change = chg; k.collectedAt = ts; k.manualCheck = true;
      saveLocalKots();
      if (c.fb) fetch(`${c.fb}/kot/${todayKey()}/${encodeURIComponent(k.id)}.json`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: 'collected', tendered: recv, change: chg, collectedAt: ts }) }).catch(() => {});
      selectedId = null; tenderStr = '';
      toast(`✓ Collected Rs ${due.toLocaleString()}${chg > 0 ? ` · Return Rs ${chg.toLocaleString()}` : ''}`);
      render();
    }

    loadLocalKots();
    connectRealtime();
    render();
  </script>
</body>
</html>
